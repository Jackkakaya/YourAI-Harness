 svg.insertAdjacentHTML('beforeend',`<path class="wire ${dash?'dash':''}" d="${path}" marker-end="url(#arrow)"/><text class="wire-label" x="${lx}" y="${ly}" text-anchor="middle">${esc(label)}</text>`);}
}
function select(id,d){const n=d.nodes.find(n=>n.id===id);document.querySelectorAll('.node').forEach(el=>{el.classList.toggle('selected',el.dataset.id===id);el.setAttribute('aria-pressed',String(el.dataset.id===id))});$('#detail').innerHTML=`<div class="overline">SELECTED ${esc(n.kind.toUpperCase())}</div><h3>${esc(n.name)}</h3><div><div class="detail-label">它实际负责什么</div><p>${esc(n.desc)}</p><div class="detail-label">代码位置</div><div class="file">${esc(n.path)}</div></div><div><div class="detail-label">设计判断</div><div class="verdict ${n.warn?'warn':''}">${esc(n.verdict)}</div><div class="detail-label">状态</div><span class="badge ${n.warn?'warn':''}">${view==='model'&&before?'重构前快照':n.warn?'当前实现 · 值得继续收敛':'当前实现'}</span></div>`;}
function render(){const d=data();$('#view-title').textContent=d.title;$('#view-subtitle').textContent=d.sub;document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('active',t.dataset.view===view);t.setAttribute('aria-pressed',String(t.dataset.view===view))});$('#controls').innerHTML=view==='model'?`<div class="switch" aria-label="对比版本"><button id="before" class="${before?'on':''}" aria-pressed="${before}">重构前</button><button id="after" class="${!before?'on':''}" aria-pressed="${!before}">当前</button></div>`:`<span class="badge ${''}">${view==='execution'?'已落实：共享执行绑定':'已落实的边界'}</span>`;if(view==='model'){$('#before').onclick=()=>{before=true;render()};$('#after').onclick=()=>{before=false;render()};}const canvas=$('#canvas');canvas.style.height=d.height+'px';canvas.innerHTML=`<svg class="wires" viewBox="0 0 980 ${d.height}" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#8b9e90" stroke-width="1.4"/></marker></defs>${d.edges.map(([x1,y1,x2,y2,label,style,path])=>`<path class="wire ${style}" d="${path||`M${x1} ${y1} L${x2} ${y2}`}" marker-end="url(#arrow)"/><text class="wire-label" x="${(x1+x2)/2}" y="${path?(label==='预算值'?543:label==='也实现 SessionManager'?615:(y1+y2)/2-12):(y1+y2)/2-9}" text-anchor="middle">${esc(label)}</text>`).join('')}</svg>`+d.nodes.map(n=>`<button class="node ${n.warn?'warn':''}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px" aria-label="查看 ${n.name} 的职责"><span class="node-head" style="display:block"><span class="kind">${esc(n.kind)}</span><span class="name">${esc(n.name)}</span></span><span class="members">${n.fields.map(f=>`<span class="${f[0]==='!'?'dup':''}">${esc(f.replace(/^!/,''))}</span>`).join('')}</span></button>`).join('');canvas.querySelectorAll('.node').forEach(n=>n.onclick=()=>select(n.dataset.id,d));$('#notes').innerHTML=d.notes.map(([title,text])=>`<article class="note"><b>${esc(title)}</b><p>${esc(text)}</p></article>`).join('');select(d.default,d);wireLayout(d);}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;render()});render();
</script>
</body></html>

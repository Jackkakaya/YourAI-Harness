[workspace]
resolver = "2"
members = ["yourai-protocol", "yourai-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "process"] }
tokio-util = "0.7"
genai = "0.6.5"

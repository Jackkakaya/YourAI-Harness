[workspace]
resolver = "2"
members = ["crates/yourai-core", "crates/yourai-harness", "apps/yourai-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "process", "io-util", "time", "net"] }
tokio-util = "0.7"
genai = "0.6.5"
uuid = { version = "1", features = ["v4"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

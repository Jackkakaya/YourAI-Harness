[package]
name = "yourai-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yourai-core = { path = "../../crates/yourai-core" }
yourai-harness = { path = "../../crates/yourai-harness" }
serde.workspace = true
serde_json.workspace = true
genai.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util.workspace = true
ratatui = "0.29"
crossterm = "0.28"
libc = "0.2"
unicode-width = "0.2"
url = "2"

unicode-segmentation = "1"
pulldown-cmark = { version = "0.13", default-features = false }
# Pure-Rust syntax highlighting (fancy-regex backend, no C deps). Themes are
# built in code from palette slots, so default-themes/HTML are not needed.
syntect = { version = "5", default-features = false, features = [
    "default-fancy",
] }

[dev-dependencies]
tempfile = "3"
